name: Self-Learning Osaka Weather AI

on:
  schedule:
    - cron: "0 0 * * *"     # JST 9:00 → 観測取得→安全な学習→新予報→公開
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 1回のrunに全段階を含めるため、pending runが置換されても中間段階だけ欠落しない。
concurrency:
  group: osaka-weather-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: Fetch → Train → Forecast → Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch completed weather hours
        run: python predict_real_weather.py

      - name: Train only against the prior issued forecast
        # 事前予報と完了観測が12時間以上重なる場合だけモデルを更新する。
        run: python safe_train.py

      - name: Generate the next forecast and site
        # 学習後に新しいforecast.jsonを保存し、次回runの評価・学習に使う。
        run: python run_forecast.py

      - name: Commit generated data and model changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily Osaka weather pipeline update"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: pipeline
    environment:
      name: github-pages

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
